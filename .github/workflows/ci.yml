name: CI

on:
  push:
    # include feature branch used for CI work so runs are visible when pushing to left_labs
    branches: ["main", "master", "left_labs"]
  pull_request:
    branches: ["main", "master", "left_labs"]

jobs:
  ci-diagnostic:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Print runner diagnostics
        shell: bash
        run: |
          echo "Runner: $(uname -a)"
          echo "Disk usage:"; df -h || true
          echo "Memory:"; free -h || true
          echo "Env vars (selected):"; env | grep GH || true
          echo "--- docker info ---"; docker --version || true; docker compose version || true

  frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Angular app
        run: npm run build

  backend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Restore backend
        run: |
          dotnet restore backend/LensApi/LensApi.csproj
          dotnet restore backend/RecommendationsApi/RecommendationsApi.csproj
          dotnet restore backend/ApiGateway/ApiGateway.csproj

      - name: Build backend
        run: |
          dotnet build backend/LensApi/LensApi.csproj --configuration Release --no-restore
          dotnet build backend/RecommendationsApi/RecommendationsApi.csproj --configuration Release --no-restore
          dotnet build backend/ApiGateway/ApiGateway.csproj --configuration Release --no-restore

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Collect LensApi.csproj diagnostic
        run: |
          mkdir -p diag
          echo "---- Begin LensApi.csproj ----" > diag/LensApi.csproj.txt || true
          sed -n '1,400p' backend/LensApi/LensApi.csproj >> diag/LensApi.csproj.txt || true
          echo "---- End LensApi.csproj ----" >> diag/LensApi.csproj.txt || true
        shell: bash

      - name: Upload LensApi csproj diagnostic
        uses: actions/upload-artifact@v4
        with:
          name: LensApi-csproj-diagnostic
          path: diag/LensApi.csproj.txt

      - name: Pack LensApi directory for diagnostic
        run: |
          mkdir -p diag
          tar -czf diag/LensApi-ci-dump.tar.gz -C backend/LensApi . || true
        shell: bash

      - name: Upload LensApi directory artifact
        uses: actions/upload-artifact@v4
        with:
          name: LensApi-ci-dump
          path: diag/LensApi-ci-dump.tar.gz

      - name: Sanitize merge markers in LensApi
        # Run the PowerShell sanitizer script added under scripts/
        shell: pwsh
        run: |
          Write-Host "Running merge-marker sanitizer script"
          ./scripts/fix-merge-markers.ps1

      - name: "Diagnostic: list LensApi files and search conflict markers"
        shell: bash
        run: |
          echo "---- ls backend/LensApi ----"
          ls -la backend/LensApi || true
          echo "---- grep for conflict markers (<<<<<<<) ----"
          grep -nR "^<<<<<<<" backend/LensApi || true
          echo "---- grep for conflict markers (=======) ----"
          grep -nR "^=======" backend/LensApi || true
          echo "---- grep for conflict markers (>>>>>>>) ----"
          grep -nR "^>>>>>>>" backend/LensApi || true

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: "Docker: print versions and config"
        shell: bash
        run: |
          echo "--- docker version ---"
          docker --version || true
          echo "--- docker compose version ---"
          docker compose version || true
          echo "--- docker info (short) ---"
           docker info --format '{{json .}}' 2>/dev/null || true

      - name: Build Docker images
        run: |
          # pull base images to avoid cache surprises in CI, and produce verbose output for diagnostics
          docker build --pull --no-cache --progress=plain -f backend/LensApi/Dockerfile -t lens-lensapi:ci ./backend/LensApi
          docker build --pull --no-cache --progress=plain -f backend/RecommendationsApi/Dockerfile -t lens-recommendationsapi:ci ./backend/RecommendationsApi
          docker build --pull --no-cache --progress=plain -f backend/ApiGateway/Dockerfile -t lens-apigateway:ci ./backend/ApiGateway

  integration-smoke:
    runs-on: ubuntu-latest
    needs: [docker-build]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Docker compose diagnostics
        shell: bash
        run: |
          echo "--- docker and compose versions ---"
          docker --version || true
          docker compose version || true
          echo "--- docker-compose.ci.yml config ---"
          docker compose -f docker-compose.ci.yml config || true

      - name: Ensure clean docker state
        shell: bash
        run: |
          # ensure no leftover containers/volumes from previous runs
          docker compose -f docker-compose.ci.yml down -v || true

      - name: Start services
        run: docker compose -f docker-compose.ci.yml up -d --build

      - name: Wait for DB migrations
        run: |
          # Discover migration ids under backend/*/Migrations and require they appear in the migrations table
          # List migration files but exclude designer and snapshot files
          MIG_FILES=$(ls backend/*/Migrations/[0-9]*_*.cs 2>/dev/null | grep -v '\.Designer\.cs$' | grep -v 'ModelSnapshot.cs' || true)
          EXPECTED_MIGS=()
          for f in $MIG_FILES; do
            M=$(basename "$f" .cs)
            # strip accidental suffixes like .Designer if present
            M=${M%.Designer}
            M=${M%ModelSnapshot}
            EXPECTED_MIGS+=("$M")
          done

          if [ ${#EXPECTED_MIGS[@]} -eq 0 ]; then
            echo "No migrations found in backend/*/Migrations; skipping explicit check"
            exit 0
          fi

          echo "Expecting migrations: ${EXPECTED_MIGS[*]}"

          # Poll Postgres until all expected migration ids are present
          for i in {1..120}; do
            FOUND=0
            for mig in "${EXPECTED_MIGS[@]}"; do
              CNT=$(docker compose -f docker-compose.ci.yml exec -T postgres psql -U postgres -d lens_bd -t -c "SELECT count(*) FROM \"__EFMigrationsHistory\" WHERE \"MigrationId\" = '$mig';" 2>/dev/null | tr -d '[:space:]') || CNT=0
              if [ -n "$CNT" ] && [ "$CNT" -gt 0 ]; then
                FOUND=$((FOUND+1))
              fi
            done

            if [ "$FOUND" -eq "${#EXPECTED_MIGS[@]}" ]; then
              echo "All migrations applied (found=$FOUND)"
              exit 0
            fi

            echo "Waiting for migrations to be applied... ($i/120) (found=$FOUND/${#EXPECTED_MIGS[@]})"
            if [ $((i % 12)) -eq 0 ]; then
              echo "--- DIAGNOSTICS: docker compose ps ---"
              docker compose -f docker-compose.ci.yml ps || true
              echo "--- DIAGNOSTICS: recent logs (last 30s) ---"
              docker compose -f docker-compose.ci.yml logs --no-color --since 30s || true
            fi
            sleep 5
          done

          echo "Migrations not applied in time"
          docker compose -f docker-compose.ci.yml ps
          docker compose -f docker-compose.ci.yml logs --no-color
          exit 1

      - name: Wait for health endpoints
        run: |
          for i in {1..60}; do
            if curl -fsS http://localhost:5000/health >/dev/null \
              && curl -fsS http://localhost:5126/health >/dev/null \
              && curl -fsS http://localhost:5127/health >/dev/null; then
              echo "Health checks OK";
              exit 0;
            fi
            echo "Waiting for services... ($i/60)";
            if [ $((i % 10)) -eq 0 ]; then
              echo "--- DIAGNOSTICS: docker compose ps ---"
              docker compose -f docker-compose.ci.yml ps || true
            fi
            sleep 5;
          done
          echo "Health checks failed";
          docker compose -f docker-compose.ci.yml ps;
          docker compose -f docker-compose.ci.yml logs --no-color;
          exit 1

      - name: Stop services
        if: always()
        run: docker compose -f docker-compose.ci.yml down -v
