services:
  postgres:
    image: postgres:16
    container_name: lens-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-lens_bd}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d lens_bd"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - lens-network

  rabbitmq:
    image: rabbitmq:3-management
    container_name: lens-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:-guest}
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - lens-network

  redis:
    image: redis:7
    container_name: lens-redis
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - lens-network

  seq:
    image: datalust/seq:latest
    container_name: lens-seq
    ports:
      - "5341:80"
    environment:
      ACCEPT_EULA: "Y"
    networks:
      - lens-network

  lensapi:
    build:
      context: ./backend/LensApi
      dockerfile: Dockerfile
    container_name: lens-lensapi
    ports:
      - "5126:5126"
    environment:
      - ASPNETCORE_ENVIRONMENT=${ASPNETCORE_ENVIRONMENT:-Development}
      - ConnectionStrings__DefaultConnection=Host=${POSTGRES_HOST:-postgres};Port=${POSTGRES_PORT:-5432};Database=${POSTGRES_DB:-lens_bd};Username=${POSTGRES_USER:-postgres};Password=${POSTGRES_PASSWORD:-postgres}
      - Redis__Configuration=${REDIS_HOST:-redis}:6379
      - RabbitMq__Host=${RABBITMQ_HOST:-rabbitmq}
      - RabbitMq__Port=${RABBITMQ_PORT:-5672}
      - RabbitMq__Username=${RABBITMQ_DEFAULT_USER:-guest}
      - RabbitMq__Password=${RABBITMQ_DEFAULT_PASS:-guest}
      - RabbitMq__VirtualHost=${RABBITMQ_VHOST:-/}
      - RabbitMq__QueueName=${RABBITMQ_QUEUE:-lens.cache.invalidations}
      - Jwt__Key=${JWT_KEY:-dev-super-secret-key-change-me-please}
      - Jwt__Issuer=${JWT_ISSUER:-lens-app}
      - Jwt__Audience=${JWT_AUDIENCE:-lens-app-users}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:5126/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - lens-network

  recommendationsapi:
    build:
      context: ./backend/RecommendationsApi
      dockerfile: Dockerfile
    container_name: lens-recommendationsapi
    ports:
      - "5127:5127"
    environment:
      - ASPNETCORE_ENVIRONMENT=${ASPNETCORE_ENVIRONMENT:-Development}
      - ConnectionStrings__DefaultConnection=Host=${POSTGRES_HOST:-postgres};Port=${POSTGRES_PORT:-5432};Database=${POSTGRES_DB:-lens_bd};Username=${POSTGRES_USER:-postgres};Password=${POSTGRES_PASSWORD:-postgres}
      - Redis__Configuration=${REDIS_HOST:-redis}:6379
      - RabbitMq__Host=${RABBITMQ_HOST:-rabbitmq}
      - RabbitMq__Port=${RABBITMQ_PORT:-5672}
      - RabbitMq__Username=${RABBITMQ_DEFAULT_USER:-guest}
      - RabbitMq__Password=${RABBITMQ_DEFAULT_PASS:-guest}
      - RabbitMq__VirtualHost=${RABBITMQ_VHOST:-/}
      - RabbitMq__QueueName=${RABBITMQ_QUEUE:-lens.cache.invalidations}
      - Jwt__Key=${JWT_KEY:-dev-super-secret-key-change-me-please}
      - Jwt__Issuer=${JWT_ISSUER:-lens-app}
      - Jwt__Audience=${JWT_AUDIENCE:-lens-app-users}
      - LensApi__BaseUrl=${LENSAPI_BASEURL:-http://lensapi:5126/}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:5127/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - lens-network

  identityapi:
    build:
      context: ./backend/IdentityApi
      dockerfile: Dockerfile
    container_name: lens-identityapi
    ports:
      - "5128:5128"
    environment:
      - ASPNETCORE_ENVIRONMENT=${ASPNETCORE_ENVIRONMENT:-Development}
      - ConnectionStrings__DefaultConnection=Host=${POSTGRES_HOST:-postgres};Port=${POSTGRES_PORT:-5432};Database=${POSTGRES_DB:-lens_bd};Username=${POSTGRES_USER:-postgres};Password=${POSTGRES_PASSWORD:-postgres}
      - Redis__Configuration=${REDIS_HOST:-redis}:6379
      - Jwt__Key=${JWT_KEY:-dev-super-secret-key-change-me-please}
      - Jwt__Issuer=${JWT_ISSUER:-lens-app}
      - Jwt__Audience=${JWT_AUDIENCE:-lens-app-users}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:5128/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - lens-network

  apigateway:
    build:
      context: ./backend/ApiGateway
      dockerfile: Dockerfile
    container_name: lens-apigateway
    ports:
      - "5000:5000"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
    depends_on:
      - lensapi
      - recommendationsapi
      - identityapi
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:5000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - lens-network

networks:
  lens-network:
    driver: bridge

volumes:
  postgres_data:
